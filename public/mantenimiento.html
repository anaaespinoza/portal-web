<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mantenimiento</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      color: #1a1a2e;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 460px;
      margin: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #e8f0fb;
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    h1 { font-size: 26px; margin-bottom: 12px; }
    p { font-size: 15px; line-height: 1.6; color: #555; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Mantenimiento</span>
    <h1>Estamos trabajando para ti</h1>
    <p>El sitio est&aacute; en mantenimiento por el momento. Disculpa las molestias, en breve estaremos de vuelta.</p>
  </main>
</body>
</html>
